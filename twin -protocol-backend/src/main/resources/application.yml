server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: bolt-tiger

  datasource:
    url: jdbc:mysql://localhost:3306/twin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root123456

  data:
    redis:
      password: redis123456
      host: localhost
      port: 6379
      database: 0

  quartz:
    job-store-type: jdbc
    wait-for-jobs-to-complete-on-shutdown: false
    overwrite-existing-jobs: true
    auto-startup: true
    startup-delay: 0s
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: bolt-tiger-prod
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            # 表前缀
            tablePrefix: qrtz_
            # 是否开启集群
            isClustered: true
            dataSource: quartz
            clusterCheckinInterval: 10000
            useProperties: true
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true

# JWT配置
jwt:
  secret: y!S@ec#etK$e1pi$jsj120jkD06AKndjsg9867SKdfb#@sd
  expiration: 86400000

#ak sk
aksk:
  enabled: true
  signature-expiration: 300
  accessKey: AK123456
  secretKey: SK123456

LOG_LEVEL: info

# 入金签名配置（对应合约 Deposit.sol 的 EIP-712 域）
deposit:
  # signer 私钥（合约 signer 地址对应的私钥），生产环境请用环境变量注入
  signer-private-key: ${DEPOSIT_SIGNER_PRIVATE_KEY:5126dfca302aee2ac31b9dd23b3d17b4c745f15ac8efeb9be149d658143e22d3}
  # 入金合约地址（EIP-712 verifyingContract）
  contract-address: ${DEPOSIT_CONTRACT_ADDRESS:0x17cA8f831DDF0C6845A77f7c3F1945c14b5F96e1}
  # 链ID（Polygon 主网 137）
  chain-id: ${DEPOSIT_CHAIN_ID:137}
  domain-name: TwinProtocolDeposit
  domain-version: "1"
  # 签名有效期（秒）
  signature-ttl-seconds: 600
  # 最低入金金额（USDC）。测试环境调小便于联调，生产按业务改回 100
  min-amount: ${DEPOSIT_MIN_AMOUNT:0.001}
  # 入金金额步长（USDC），入金金额必须是该值的整数倍
  step-amount: ${DEPOSIT_STEP_AMOUNT:0.001}

bamboo:
  is-open: true
  auto-initialize-schema: true
  auto-initialize-check-point: false
  auto-start-engine: false
  schedule-initial-seconds: 10
  schedule-delay-seconds: 5
  unprocessed-retry-seconds: 300
  blockchains:
    polygon:
      id: 137
      rpc-node-url: wss://polygon-bor-rpc.publicnode.com
      event-listener:
        contract-event-definitions:
          "0x17cA8f831DDF0C6845A77f7c3F1945c14b5F96e1":
            - signature: "DepositExecuted(uint256 indexed stakeId, address indexed user, uint256 usdcAmount, uint256 toDividend, uint256 tipBought, uint256 liquidity, uint256 dustUSDC, uint256 dustTIP)"
              signature-hash: "0x3e1f8c5d4b6f9e2a1c3b4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5g"
              description: "入金事件"
          "0xe2A0891d87F0E291F976FdDf558CFa9BA9A05d1A":
            - signature: "Staked(address indexed user, uint256 amount, uint256 plan, uint256 startTime, uint256 endTime)"
              signature-hash: "0x4f5e6d7c8b9a0b1c2d3e4f5g6h7i8j9k0l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5a"
              description: "质押事件"
            - signature: "Withdrawn(uint256 indexed stakeId, address indexed user, uint256 amount)"
              signature-hash: "0x4f5e6d7c8b9a0b1c2d3e4f5g6h7i8j9k0l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5a"
              description: "解押事件"
          "0x79aD7dd38b40b8771f718e2320c86638bB79a944":
            - signature: "Withdraw(address indexed user, uint8 indexed rewardType, uint8 indexed assetType, uint256 amount, uint256 fee)"
              signature-hash: "0x5e6d7c8b9a0b1c2d3e4f5g6h7i8j9k0l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5a6b"
              description: "分红提取事件"
          "0x3f098643fBe056EA88aabF54afe36CAeb1406978":
            - signature: "RemoveLiquidity(address indexed user, uint256 liquidity, uint256 usdcOut, uint256 tipToDividend)"
              signature-hash: "0x6d7c8b9a0b1c2d3e4f5g6h7i8j9k0l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5a6b7c"
              description: "移除流动性事件"
          "0x9E53704F1a0D7Cd0621Ca9b343605C35E4A5134A":
            - signature: "burnPool(uint256 burnAmount, uint256 toBurn, uint256 toDividend)"
              signature-hash: "0x7c8b9a0b1c2d3e4f5g6h7i8j9k0l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5a6b7c8d"
              description: "燃烧底池事件"


