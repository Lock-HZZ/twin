# ============================================
# Dividend Contract Configuration
# ============================================
dividend:
  contract:
    # 分红合约地址（部署后填写）
    contract-address: 0xYourDividendContractAddress

    # RPC 节点地址
    # Polygon 主网: https://polygon-rpc.com
    # Mumbai 测试网: https://rpc-mumbai.maticvigil.com
    rpc-url: https://polygon-rpc.com

    # 操作员私钥（用于签名交易，需要有 operator 权限）
    # 注意：生产环境请使用环境变量或加密存储
    operator-private-key: ${DIVIDEND_OPERATOR_PRIVATE_KEY:your_private_key_here}

    # Gas 价格（Gwei），为空则使用网络建议值
    # Polygon 主网通常 30-100 Gwei
    gas-price: 50

    # Gas 限制
    gas-limit: 3000000

    # 链 ID
    # Polygon 主网: 137
    # Mumbai 测试网: 80001
    chain-id: 137
